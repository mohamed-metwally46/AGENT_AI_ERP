# Document questions: answers that must come from an ingested document, with a
# citation that resolves.
#
# `expect_documents` names filenames, not ids. The harness derives the id with
# RAG's own rule, so this file cannot drift from the index it measures -- which
# is what would happen if the hashes were written out and the corpus was
# re-ingested under a different name.
#
# Every case runs as a principal whose scope actually reaches the document it
# expects. A document case that quietly relied on organisation scope would be
# measuring retrieval and permission at once and telling you neither.

schema_version: 1

cases:
  - id: document-annual-leave-entitlement
    question: "What is the annual leave policy?"
    question_class: document
    principal: self
    expect_tools: [search_documents]
    expect_documents: [annual_leave_policy.md]
    replay:
      calls:
        - tool: search_documents
          arguments: {query: "annual leave entitlement policy", top_k: 3}
      answer: "The handbook sets out the annual leave entitlement and how it accrues [1]."

  - id: document-annual-leave-accrual
    question: "How does annual leave accrue?"
    question_class: document
    principal: self
