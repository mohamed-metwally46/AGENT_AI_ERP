  - id: document-unanswerable
    question: "How do we service the company submarine fleet?"
    question_class: document
    principal: self
    expect_tools: [search_documents]
    note: >
      Nothing in the corpus answers this. The measurement is that the answer
      says so instead of improvising, and cites nothing -- which is why the case
      names no expected document.
    replay:
      calls:
        - tool: search_documents
          arguments: {query: "submarine fleet maintenance schedule", top_k: 3}
      answer: "I could not find that in the documents or records available to you."
