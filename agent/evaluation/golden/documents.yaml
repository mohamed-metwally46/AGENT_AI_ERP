  - id: document-engineering-runbook-oncall
    question: "How does the engineering on-call rotation work?"
    question_class: document
    principal: organisation
    expect_tools: [search_documents]
    expect_documents: [engineering_runbook.md]
    note: >
      Team-scoped document, asked by a principal whose scope reaches it. The
      security set asks the same question as somebody whose scope does not.
    replay:
      calls:
        - tool: search_documents
          arguments: {query: "on-call rotation weekly handover", top_k: 3}
      answer: "The rotation runs weekly with a Monday handover [1]."

