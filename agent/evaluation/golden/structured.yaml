        FROM employees e
        LEFT JOIN branch_departments d ON d.dept_id = e.dept_id
       WHERE lower(d.dept_name) = 'human resources'
    expect_row: {total: 5, active: 2}
    note: >
      The gap between total and active is wide here, which is why the case
      exists: an answer that reports only one of the two is misleading, and the
      prompt requires both.
    replay:
      calls:
        - tool: count_employees
          arguments: {department: Human Resources}
      answer: "Human Resources has 5 employees on file, of whom 2 are active [1]."

