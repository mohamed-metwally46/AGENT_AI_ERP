# Structured questions: figures that have exactly one right answer.
#
# Every case here carries a control query written by hand and run through the
# same read-only barrier as the tools. That is the point of the class: a
# headcount is either right or wrong, and "the model sounded confident" is not
# evidence. The control query is the independent witness.
#
# The numbers below come from the seeded mock database. `docker compose down -v`
# re-seeds it and they change; the control queries do not, which is why they are
# here rather than the numbers alone.

schema_version: 1

cases:
  - id: structured-sales-headcount
    question: "How many employees are in Sales?"
    question_class: structured
    principal: organisation
    expect_tools: [count_employees]
    expect_arguments:
      count_employees: {department: Sales}
    control_sql: >
      SELECT count(*) AS total,
             count(*) FILTER (WHERE e.employment_status = 'active') AS active
        FROM employees e
        LEFT JOIN branch_departments d ON d.dept_id = e.dept_id
       WHERE lower(d.dept_name) = 'sales'
    expect_row: {total: 12, active: 11}
    replay:
      calls:
        - tool: count_employees
          arguments: {department: Sales}
      answer: "Sales has 12 employees, 11 of them active [1]."

