  - id: structured-leave-policy-annual
    question: "What is the annual leave entitlement under company policy?"
    question_class: structured
    principal: organisation
    expect_tools: [get_leave_policy]
    expect_arguments:
      get_leave_policy: {leave_code: ANN}
    control_sql: >
      SELECT lp.annual_entitlement_days AS entitlement,
             lp.max_carry_forward_days  AS carry_forward,
             lp.notice_days             AS notice
        FROM leave_policies lp
        JOIN leave_types lt ON lt.leave_type_id = lp.leave_type_id
       WHERE lt.leave_code = 'ANN' AND lp.scope = 'all'
       LIMIT 1
    expect_row: {entitlement: 21, carry_forward: 5, notice: 7}
    replay:
      calls:
        - tool: get_leave_policy
          arguments: {leave_code: ANN}
      answer: >
        The organisation-wide annual entitlement is 21 days, with up to 5 days
        carried forward and 7 days' notice required [1].

