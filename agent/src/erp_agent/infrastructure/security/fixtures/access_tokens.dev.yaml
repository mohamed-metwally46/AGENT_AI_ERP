# Dev-mode API credentials for the ERP AI agent.
#
# ---------------------------------------------------------------------------
# THESE ARE NOT SECRETS AND MUST NOT REACH A REAL DEPLOYMENT.
#
# They are static, non-expiring, committed to the repository, and readable by
# anyone who can read this file. They exist so `POST /ask` can be exercised
# locally as each of the mock users, and for nothing else. The composition root
# refuses this packaged file when APP_ENV=production, and `run_startup_checks`
# refuses it again independently.
#
# Real credentials live in the Platform's `_core.personal_access_tokens`, which
# is classified CRITICAL / NO_DIRECT_AI_ACCESS (Plan.md section 4) -- the agent
# is not permitted to read that table. The cutover replaces this file with a
# call to the Platform, not with a query.
# ---------------------------------------------------------------------------
#
# `identity` is the `user_id` from identity.dev.yaml -- what `users.id` supplies
# after cutover. It is deliberately NOT an employee id: keying credentials on an
# employee would make this file unreplaceable by a real one.
#
# Unlike the fixture this replaced, nothing here is a uuid, so `docker compose
# down -v` no longer invalidates it.

schema_version: 1

tokens:
  - token: "dev-token-admin-1001"
    identity: "1001"
    label: "dev: admin (EMP-0001) -- organisation scope"

  - token: "dev-token-hr-manager-1002"
    identity: "1002"
    label: "dev: HR manager (EMP-0002) -- branch scope, contact PII"

  - token: "dev-token-hr-employee-1048"
    identity: "1048"
    label: "dev: HR employee (EMP-0048) -- department scope, contact PII"

  - token: "dev-token-sales-manager-1008"
    identity: "1008"
    label: "dev: sales manager (EMP-0008) -- team scope"

  # The narrowest rung, and the one the security suite uses to prove
  # cross-scope reads are refused by the filter rather than by the model.
  - token: "dev-token-employee-1016"
    identity: "1016"
    label: "dev: employee (EMP-0016) -- self scope"

  # --- multiple roles -----------------------------------------------------
  - token: "dev-token-hr-payroll-1006"
    identity: "1006"
    label: "dev: hr_employee + payroll_officer (EMP-0006) -- permissions unite"

  - token: "dev-token-payroll-employee-1003"
    identity: "1003"
    label: "dev: employee + payroll_officer (EMP-0003) -- widest scope wins"
