# Dev-mode principals for the ERP AI agent.
#
# Stands in for the Platform `users` / `user_roles` tables, which `mock_hr` does
# not have and which this phase must not create (Plan.md section 8.5, gap S6).
# Phase 9 replaces this file with a real join and deletes it.
#
# ---------------------------------------------------------------------------
# WARNING: the employee_id values below are UUIDs generated by a specific run of
# database/seed/hr_seed.sql. `docker compose down -v` re-seeds the database with
# NEW uuids and every entry here stops resolving.
#
# To regenerate after a re-seed:
#     docker exec mock-hr-postgres psql -U hr_user -d mock_hr -At -F'|' -c \
#       "SELECT employee_number, employee_id, dept_id, branch_id FROM employees
#         WHERE employee_number IN ('EMP-0001','EMP-0002','EMP-0006','EMP-0016')
#         ORDER BY employee_number;"
#
# The employee_number in each comment is the stable business key; use it to find
# the row again. This brittleness is why the test suite has its own fixture with
# synthetic ids rather than sharing this file.
# ---------------------------------------------------------------------------

schema_version: 1

principals:
  # EMP-0001 -- CEO, Executive Office. Reads the whole organisation.
  - user_id: "1001"
    employee_id: "6eb471ef-d1c0-42ec-883c-e558f57b3e3f"
    scope: organisation
    dept_id: "89914bef-fe61-4000-b0b9-6067d0651b51"
    branch_id: "ade18def-33ff-443a-91f7-af0f814c3d83"
    role_names:
      - executive

  # EMP-0002 -- HR director. Branch-scoped, and holds the HR role, so contact
  # PII about other employees is readable. Compensation still is not: that
  # needs a payroll role (Plan.md section 8.3).
  - user_id: "1002"
    employee_id: "1664d64d-5e12-48d4-b3eb-bf75ec5bc1c5"
    scope: branch
    dept_id: "0bbbf42a-aaef-4c5e-b48c-4926c592bfc3"
    branch_id: "ade18def-33ff-443a-91f7-af0f814c3d83"
    allowed_branch_ids:
      - "ade18def-33ff-443a-91f7-af0f814c3d83"
    role_names:
      - hr_manager

  # EMP-0006 -- HR manager with 5 direct reports. Team-scoped: the reporting
  # tree itself is computed from the database, never asserted here.
  - user_id: "1006"
    employee_id: "257997bf-6d5d-4ad0-93ec-6b8ebb6984d9"
    scope: team
    dept_id: "0bbbf42a-aaef-4c5e-b48c-4926c592bfc3"
    branch_id: "ade18def-33ff-443a-91f7-af0f814c3d83"
    role_names:
      - hr

  # EMP-0016 -- Sales individual contributor. Self-scoped: the narrowest rung,
  # and the one the security suite uses to prove cross-scope reads are refused.
  - user_id: "1016"
    employee_id: "4a19ff00-cd08-4d02-a6c9-0c0c5706107d"
    scope: self
    dept_id: "ba43d834-eaeb-436b-bdbc-33031d7f5f4d"
    branch_id: "ade18def-33ff-443a-91f7-af0f814c3d83"
    role_names:
      - employee
