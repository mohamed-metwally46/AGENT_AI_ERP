; Layering contracts enforcing the Dependency Rule for the ERP agent.
;
; Deliberately mirrors RAG/importlinter.ini -- one idiom across the repository
; (Plan.md section 10). These contracts are executable architecture: they run in
; `make arch` and a violation fails the build.
;
; Run with:  lint-imports --config importlinter.ini

[importlinter]
root_package = erp_agent
include_external_packages = True


; --------------------------------------------------------------------------- ;
; 1. The core layering: dependencies point inward only.
; --------------------------------------------------------------------------- ;
[importlinter:contract:1]
name = Clean Architecture layers (interfaces -> application -> domain)
type = layers
layers =
    erp_agent.interfaces
    erp_agent.application
    erp_agent.domain


; --------------------------------------------------------------------------- ;
; 2. The domain is the centre: it depends on nothing.
; --------------------------------------------------------------------------- ;
[importlinter:contract:2]
name = Domain depends on no other layer
type = forbidden
source_modules =
    erp_agent.domain
forbidden_modules =
    erp_agent.application
    erp_agent.interfaces
    erp_agent.infrastructure
    erp_agent.core
    erp_agent.config


; --------------------------------------------------------------------------- ;
; 3. The domain imports no third-party package.
;
;    The security policies live in the domain. They must be testable, and
;    reviewable, without a database driver or a settings library in the way.
; --------------------------------------------------------------------------- ;
[importlinter:contract:3]
name = Domain imports no third-party package
type = forbidden
source_modules =
    erp_agent.domain
forbidden_modules =
    pydantic
    pydantic_settings
    structlog
    psycopg
    psycopg_pool
    qdrant_client
    openai
    google
    anthropic
    httpx
    requests
    fastapi
    rag


; --------------------------------------------------------------------------- ;
; 4. Use cases must be executable against in-memory doubles, with zero network.
; --------------------------------------------------------------------------- ;
[importlinter:contract:4]
name = Application does not depend on infrastructure, interfaces or config
type = forbidden
source_modules =
    erp_agent.application
forbidden_modules =
    erp_agent.infrastructure
    erp_agent.interfaces
    erp_agent.config
allow_indirect_imports = True


[importlinter:contract:5]
name = Application imports no vendor SDK
type = forbidden
source_modules =
    erp_agent.application
forbidden_modules =
    psycopg
    psycopg_pool
    qdrant_client
    openai
    google
    anthropic
    fastapi
allow_indirect_imports = True


; --------------------------------------------------------------------------- ;
; 6. The API resolves use cases from the composition root; reaching the database
;    driver directly is not the intended path.
; --------------------------------------------------------------------------- ;
[importlinter:contract:6]
name = Interfaces do not import infrastructure directly
type = forbidden
source_modules =
    erp_agent.interfaces
forbidden_modules =
    erp_agent.infrastructure
allow_indirect_imports = True


; --------------------------------------------------------------------------- ;
; 7. Adapters implement ports; they never reach back into orchestration.
; --------------------------------------------------------------------------- ;
[importlinter:contract:7]
name = Infrastructure does not depend on application or interfaces
type = forbidden
source_modules =
    erp_agent.infrastructure
forbidden_modules =
    erp_agent.application
    erp_agent.interfaces
allow_indirect_imports = True


; --------------------------------------------------------------------------- ;
; 8. Config is a leaf. It is injected, never imported by the code it configures.
; --------------------------------------------------------------------------- ;
[importlinter:contract:8]
name = Config imports nothing from the application
type = forbidden
source_modules =
    erp_agent.config
forbidden_modules =
    erp_agent.domain
    erp_agent.application
    erp_agent.interfaces
    erp_agent.infrastructure
    erp_agent.core
